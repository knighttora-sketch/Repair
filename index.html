<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cek Struktur Database</title>
    <style>
        body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
        button { padding: 10px 20px; background: #6366f1; color: white; border: none; cursor: pointer; margin-bottom: 20px; }
        #output { white-space: pre-wrap; background: #222; padding: 15px; border-radius: 5px; border: 1px solid #444; max-height: 80vh; overflow: auto; }
    </style>
</head>
<body>
    <h2>Pendeteksi Akar Database</h2>
    <p>Tombol ini akan mencetak SEGALA SESUATU yang ada di root database Anda.</p>
    <button onclick="window.scanRoot()">SCAN SEMUA DATA</button>
    
    <div id="output">Menunggu scan...</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ISI CONFIG ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyCul8W17gn3ckp1_B6JFfhqYOPfexXilrY",
            authDomain: "fca1a.firebaseapp.com",
            databaseURL: "https://fireba-fca1a-default-rtdb.asia-southeast1.firebasedatabase.app", // PENTING: URL Database Realtime
            projectId: "fireba-fca1a",
            storageBucket: "fireba-fca1a.firebasestorage.app",
            messagingSenderId: "507496403967",
            appId: "1:507496403967:web:9fe048882aeffd84ae4dca"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.scanRoot = async () => {
            const out = document.getElementById('output');
            out.innerText = "Sedang scanning root database...\n";

            try {
                // Kita baca langsung dari ROOT (tanpa path)
                const snapshot = await get(ref(db));
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    
                    // Cetak strukturnya agar terlihat seperti pohon
                    out.innerText += JSON.stringify(data, null, 2);
                    
                    // Analisa sederhana
                    out.innerText += "\n\n--- ANALISIS ---\n";
                    if (data.accounts) {
                        out.innerText += "✅ Node 'accounts' DITEMUKAN.\n";
                        const keys = Object.keys(data.accounts);
                        out.innerText += `   Isi ada: ${keys.length} item.\n`;
                        if (keys.length > 0) {
                            const firstKey = keys[0];
                            out.innerText += `   Contoh data pertama: ${JSON.stringify(data.accounts[firstKey])}\n`;
                        }
                    } else {
                        out.innerText += "❌ Node 'accounts' TIDAK DITEMUKAN.\n";
                        out.innerText += "   Apakah Anda menamainya 'account' (tanpa s) atau nama lain?\n";
                        out.innerText += "   Nama node yang ada di database:\n";
                        Object.keys(data).forEach(k => out.innerText += `   - ${k}\n`);
                    }

                } else {
                    out.innerText = "Database BENAR-BENAR KOSONG (Null).";
                }
            } catch (e) {
                out.innerText = `ERROR: ${e.message}\n\nPastikan Database URL di config benar dan Rules allow read: true`;
            }
        };
    </script>
</body>
</html>
