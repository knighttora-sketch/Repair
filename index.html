<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Import Data (Fixed Path)</title>
    <style>
        :root { --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --primary: #6366f1; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; background: var(--card); padding: 2rem; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: var(--primary); margin-bottom: 20px; }
        .section { margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #334155; }
        label { display: block; margin-bottom: 8px; color: #94a3b8; }
        textarea { width: 100%; height: 120px; background: #000; border: 1px solid #475569; color: #0f0; padding: 10px; font-family: monospace; border-radius: 6px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .log { background: black; color: yellow; padding: 10px; margin-top: 20px; height: 150px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Import Stok (Realtime DB)</h2>

        <!-- Import KODE -->
        <div class="section">
            <label>1. Input Kode Redeem (JSON)</label>
            <textarea id="input-codes" placeholder='[{"code": "VIP1", "status": "active"}, {"code": "VIP2", "status": "active"}]'></textarea>
            <button onclick="window.importCodes()">Upload Kode</button>
        </div>

        <!-- Import AKUN -->
        <div class="section">
            <label>2. Input Akun (JSON)</label>
            <textarea id="input-accounts" placeholder='[{"email": "user1@gmail.com", "password": "pass", "status": "active"}]'></textarea>
            <button onclick="window.importAccounts()">Upload Akun</button>
        </div>

        <div id="log" class="log">Menunggu aksi...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCul8W17gn3ckp1_B6JFfhqYOPfexXilrY",
            authDomain: "fca1a.firebaseapp.com",
            databaseURL: "https://fireba-fca1a-default-rtdb.asia-southeast1.firebasedatabase.app", // PENTING: URL Database Realtime
            projectId: "fireba-fca1a",
            storageBucket: "fireba-fca1a.firebasestorage.app",
            messagingSenderId: "507496403967",
            appId: "1:507496403967:web:9fe048882aeffd84ae4dca"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const logDiv = document.getElementById('log');

        function log(msg) {
            logDiv.innerHTML += `<div>> ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // Import Kode -> Masuk ke 'codes'
        window.importCodes = async () => {
            const val = document.getElementById('input-codes').value;
            if(!val) return log("Error: JSON kosong");
            try {
                const data = JSON.parse(val);
                if(!Array.isArray(data)) throw "Format harus Array";
                
                let count = 0;
                for(const item of data) {
                    if(!item.code || !item.status) continue;
                    // Push ke node 'codes'
                    await push(ref(db, 'codes'), item);
                    count++;
                }
                log(`✅ Sukses upload ${count} Kode Redeem.`);
                document.getElementById('input-codes').value = '';
            } catch(e) { log(`❌ Error: ${e.message}`); }
        };

        // Import Akun -> Masuk ke 'codes/accounts'
        window.importAccounts = async () => {
            const val = document.getElementById('input-accounts').value;
            if(!val) return log("Error: JSON kosong");
            try {
                const data = JSON.parse(val);
                if(!Array.isArray(data)) throw "Format harus Array";
                
                let count = 0;
                for(const item of data) {
                    if(!item.email || !item.password) continue;
                    // Push ke node 'codes/accounts'
                    await push(ref(db, 'codes/accounts'), item);
                    count++;
                }
                log(`✅ Sukses upload ${count} Akun.`);
                document.getElementById('input-accounts').value = '';
            } catch(e) { log(`❌ Error: ${e.message}`); }
        };
    </script>
</body>
</html>
